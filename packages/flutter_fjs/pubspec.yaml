name: flutter_fjs
description: >-
  JS/TS runtime for Flutter. Embeds QuickJS-ng with direct JSI-style JS<->C++
  calls, runs source or bytecode bundles, and renders HTML-like JS tags as
  Flutter widgets.
version: 0.1.4
repository: https://github.com/snice/flutter-js
issue_tracker: https://github.com/snice/flutter-js/issues
documentation: https://github.com/snice/flutter-js#readme
topics:
  - javascript
  - typescript
  - quickjs
  - ffi
  - vue

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  ffi: ^2.1.0
  # ANGLE-backed GL context for canvas.getContext('webgl') (spec 021):
  # one Dart API across Android/iOS/macOS, no per-platform native code.
  # Isolated to canvas/webgl_replay.dart — swap surface if it stalls.
  # 0.1.0 is the newest line compatible with the repo's Flutter 3.24 /
  # Dart 3.5 toolchain (0.2+ pulls ffi >=2.1.4 which needs Dart >=3.7;
  # 0.4.x needs Dart ^3.8). API matches 0.3.x for everything we use.
  # Revisit on the next SDK bump.
  flutter_angle: 0.1.0
  # Matrix4, for the CSS `transform` parser (style_parse.dart stays
  # widget-free, so it cannot get it from flutter/widgets.dart)
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        pluginClass: FlutterFjsPlugin
        package: dev.flutterjs.flutter_fjs
      ios:
        pluginClass: FlutterFjsPlugin
      macos:
        pluginClass: FlutterFjsPlugin
